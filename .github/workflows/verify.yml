name: Verify game
on: [push, pull_request]
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: python3 release/build.py
      - run: python3 release/smoke.py release-output/AshenReach-0.7.0.zip
